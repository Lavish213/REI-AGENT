name: Voice and workflow regression

on:
  pull_request:
  push:
    branches: [master, repair/voice-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OUTBOUND_ENABLED: 'false'
      ENABLE_BACKGROUND_JOBS: 'false'
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_KEY: test-only
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            tests/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Backend regression, real Redis, and synthetic streaming
        run: |
          python -m coverage run --branch --source=backend -m pytest -q
          python -m coverage report --fail-under=28
          python -m compileall -q backend
      - name: Checkout coordinated Bob producer
        uses: actions/checkout@v7
        with:
          repository: Lavish213/Bob-Intelligence-
          ref: 7d265ab8b3ea244674a249504d481e55cc55973c
          path: _bob-contract
      - name: PostgreSQL migration and recovery contracts
        run: |
          npm ci --prefix tests
          npm run test:database --prefix tests
          node tests/forensic_lockdown_db.cjs
          node tests/source_price_review_db.cjs
          node tests/email_resumption_db.cjs
          node tests/provider_delivery_db.cjs
          node tests/rentcast_budget_db.cjs
          node tests/message_inventory_roundtrip.cjs
          BOB_REPO="$GITHUB_WORKSPACE/_bob-contract" node tests/bob_roundtrip.cjs
      - name: Dashboard build and HTTP fault tests
        run: |
          npm ci --prefix dashboard
          npm audit --omit=dev --audit-level=high --prefix dashboard
          env -u NEXT_PUBLIC_SUPABASE_URL -u SUPABASE_SERVICE_KEY npm run build --prefix dashboard
          npm run lint --prefix dashboard
          npm run test:dashboard --prefix tests
          node tests/bob_evidence.cjs
